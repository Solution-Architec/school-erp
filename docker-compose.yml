services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-school_erp}
      POSTGRES_USER: ${POSTGRES_USER:-school_erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-school_erp} -d ${POSTGRES_DB:-school_erp}" ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - mkdir -p /backups && chown postgres:postgres /backups && exec su-exec postgres /bin/sh /opt/backup/backup-postgres.sh
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-school_erp}
      PGUSER: ${POSTGRES_USER:-school_erp}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_RUN_ON_START: ${BACKUP_RUN_ON_START:-true}
      BACKUP_PREFIX: ${BACKUP_PREFIX:-school_erp}
    volumes:
      - ./scripts/backup-postgres.sh:/opt/backup/backup-postgres.sh:ro
      - postgres_backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ENABLE_DEMO_LOGIN: ${ENABLE_DEMO_LOGIN:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      args:
        VITE_ENABLE_DEMO_MODE: ${VITE_ENABLE_DEMO_MODE:-false}
        VITE_DEMO_PASSWORD: ${VITE_DEMO_PASSWORD:-}
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - internal

volumes:
  postgres_data:
  postgres_backups:

networks:
  internal:
    driver: bridge
