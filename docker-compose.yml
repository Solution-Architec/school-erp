services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-school_erp}
      POSTGRES_USER: ${POSTGRES_USER:-school_erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-school_erp} -d ${POSTGRES_DB:-school_erp}" ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  db-backup:
    build: ./docker/backup
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - mkdir -p /backups && chown -R "postgres:$BACKUP_GID" /backups && exec su-exec "postgres:$BACKUP_GID" /bin/sh /opt/backup/backup-postgres.sh
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-school_erp}
      PGUSER: ${POSTGRES_USER:-school_erp}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_DAILY_RETENTION_DAYS: ${BACKUP_DAILY_RETENTION_DAYS:-7}
      BACKUP_WEEKLY_RETENTION_WEEKS: ${BACKUP_WEEKLY_RETENTION_WEEKS:-4}
      BACKUP_MONTHLY_RETENTION_MONTHS: ${BACKUP_MONTHLY_RETENTION_MONTHS:-12}
      BACKUP_GID: ${BACKUP_GID:-1000}
      BACKUP_S3_URI: ${BACKUP_S3_URI:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-southeast-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      BACKUP_PARTIAL_STALE_HOURS: ${BACKUP_PARTIAL_STALE_HOURS:-48}
      BACKUP_RUN_ON_START: ${BACKUP_RUN_ON_START:-true}
      BACKUP_PREFIX: ${BACKUP_PREFIX:-school_erp}
    volumes:
      - ./scripts/backup-postgres.sh:/opt/backup/backup-postgres.sh:ro
      - ./scripts/backup-retention.py:/opt/backup/backup-retention.py:ro
      - ./scripts/cleanup-stale-backups.py:/opt/backup/cleanup-stale-backups.py:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  platform-monitor:
    build: ./monitoring
    restart: unless-stopped
    environment:
      MONITOR_INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS:-900}
      MONITOR_TIMEOUT_SECONDS: ${MONITOR_TIMEOUT_SECONDS:-12}
      MONITOR_STATE_DIR: /state
      MONITOR_INTERNAL_TOKEN: ${MONITOR_INTERNAL_TOKEN:-}
      MONITOR_DISK_WARNING_PERCENT: ${MONITOR_DISK_WARNING_PERCENT:-80}
      MONITOR_DISK_CRITICAL_PERCENT: ${MONITOR_DISK_CRITICAL_PERCENT:-90}
      MONITOR_MEMORY_WARNING_PERCENT: ${MONITOR_MEMORY_WARNING_PERCENT:-85}
      MONITOR_MEMORY_CRITICAL_PERCENT: ${MONITOR_MEMORY_CRITICAL_PERCENT:-95}
      MONITOR_CPU_LOAD_PER_CORE_WARNING: ${MONITOR_CPU_LOAD_PER_CORE_WARNING:-1.5}
      MONITOR_CPU_LOAD_PER_CORE_CRITICAL: ${MONITOR_CPU_LOAD_PER_CORE_CRITICAL:-3.0}
      BACKUP_DIR: /backups
      BACKUP_S3_URI: ${BACKUP_S3_URI:-}
      MONITOR_APP_URL: ${MONITOR_APP_URL:-http://backend:8000}
      MONITOR_TLS_HOSTS: ${MONITOR_TLS_HOSTS:-}
      MONITOR_DOMAINS: ${MONITOR_DOMAINS:-}
      MONITOR_ALERT_EMAIL: ${MONITOR_ALERT_EMAIL:-}
      MONITOR_SMTP_TEST_EMAIL: ${MONITOR_SMTP_TEST_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
    volumes:
      - platform_monitor_state:/state
      - ./backups:/backups:ro
      - /:/host/root:ro
      - /proc:/host/proc:ro
    depends_on:
      - backend
    networks:
      - internal
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ENABLE_DEMO_LOGIN: ${ENABLE_DEMO_LOGIN:-false}
      BACKUP_DIR: ${BACKUP_DIR:-/backups}
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-26}
      MONITOR_INTERNAL_TOKEN: ${MONITOR_INTERNAL_TOKEN:-}
    volumes:
      - ./backups:/backups:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - internal

  parent-reminder-worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.reminder_worker"]
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REMINDER_POLL_SECONDS: ${REMINDER_POLL_SECONDS:-900}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      args:
        VITE_ENABLE_DEMO_MODE: ${VITE_ENABLE_DEMO_MODE:-false}
        VITE_DEMO_PASSWORD: ${VITE_DEMO_PASSWORD:-}
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - internal

volumes:
  postgres_data:
  platform_monitor_state:

networks:
  internal:
    driver: bridge
