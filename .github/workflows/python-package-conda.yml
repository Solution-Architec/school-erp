name: Schoolios ERP CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate PostgreSQL backup script syntax
        run: sh -n scripts/backup-postgres.sh
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest flake8
      - name: Check Python syntax and undefined names
        run: flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Compile monitoring, retention and cleanup scripts
        run: python -m py_compile monitoring/platform-monitor.py scripts/backup-retention.py scripts/cleanup-stale-backups.py
      - name: Run backend tests
        env:
          # Test-only signing key. Never reuse this value outside CI.
          JWT_SECRET_KEY: "ci-only-test-signing-key-0123456789abcdef0123456789abcdef"
          PYTHONPATH: backend
        run: pytest -q backend/tests
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  backup:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: school_erp
          POSTGRES_USER: school_erp
          POSTGRES_PASSWORD: ci-backup-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U school_erp -d school_erp"
          --health-interval 20
          --health-retries 20
