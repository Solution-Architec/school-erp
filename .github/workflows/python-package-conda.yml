name: Schoolios ERP CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate PostgreSQL backup script syntax
        run: sh -n scripts/backup-postgres.sh
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest flake8
      - name: Check Python syntax and undefined names
        run: flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Compile monitoring, retention and cleanup scripts
        run: python -m py_compile monitoring/platform-monitor.py scripts/backup-retention.py scripts/cleanup-stale-backups.py
      - name: Run backend tests
        env:
          # Test-only signing key. Never reuse this value outside CI.
          JWT_SECRET_KEY: "ci-only-test-signing-key-0123456789abcdef0123456789abcdef"
        run: PYTHONPATH=. pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  backup:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: school_erp
          POSTGRES_USER: school_erp
          POSTGRES_PASSWORD: ci-backup-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U school_erp -d school_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - name: Build backup image
        run: docker build -t school-erp-backup-ci -f docker/backup/Dockerfile .
      - name: Create and restore-verify a PostgreSQL backup
        run: |
          mkdir -p "$RUNNER_TEMP/postgres-backups"
          docker run --rm --network host -v "$GITHUB_WORKSPACE/scripts/backup-postgres.sh:/opt/backup/backup-postgres.sh:ro" -v "$GITHUB_WORKSPACE/scripts/backup-retention.py:/opt/backup/backup-retention.py:ro" -v "$GITHUB_WORKSPACE/scripts/cleanup-stale-backups.py:/opt/backup/cleanup-stale-backups.py:ro" -v "$RUNNER_TEMP/postgres-backups:/backups" -e PGHOST=127.0.0.1 -e PGPORT=5432 -e PGDATABASE=school_erp -e PGUSER=school_erp -e PGPASSWORD=ci-backup-test-password -e BACKUP_DIR=/backups -e BACKUP_ONCE=true school-erp-backup-ci sh -c "mkdir -p /backups && chown postgres:postgres /backups && exec su-exec postgres sh /opt/backup/backup-postgres.sh"
